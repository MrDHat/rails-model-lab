version: 1
environment:
  dockerfile: environment/Dockerfile
  resources:
    cpus: 2
    memory: 2GB
    storage: 5GB
  build_timeout: 20m
  network:
    mode: public
agent:
  name: nop
  # Required metadata for no-model validation; override for future model runs.
  model: validation-only
  timeout: 10m
verifier:
  timeout: 5m
  command: bash /tests/verify.sh
  restore:
    - test
    - bin
    - config/environments/test.rb
