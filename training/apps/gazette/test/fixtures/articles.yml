  headline: Harbour Bridge tolls to rise in March
  slug: harbour-bridge-tolls-to-rise
  dek: The council says the money will pay for new cycle lanes.
  body: |
    Tolls on the Harbour Bridge will rise by 40 cents in March, the city council decided on Thursday.

    Councillors voted 9 to 4 for the increase, which will fund two new cycle lanes.
